<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local glTF Viewer</title>
  <style>
    html,body{height:100%;margin:0;background:#222;color:#ddd;font-family:Arial}
    #ui{position:absolute;left:10px;top:10px;z-index:10;background:rgba(0,0,0,0.4);padding:8px;border-radius:6px}
    #canvas{width:100%;height:100%;display:block}
    a{color:#6cf}
  </style>
</head>
<body>
  <div id="ui">
    <label>Model: <select id="modelSelect">
      <option value="cup.glb">cup.glb</option>
      <option value="dice1.glb">dice1.glb</option>
      <option value="floorplan.glb">floorplan.glb</option>
    </select></label>
    <button id="loadBtn">Load</button>
    <label style="margin-left:8px">Or drop a .glb: <input id="fileInput" type="file" accept=".glb"/></label>
    <div style="margin-top:6px;font-size:12px">Open: <a href="/" target="_blank">repo root</a> — server required</div>
  </div>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);
    const camera = new THREE.PerspectiveCamera(45,2,0.1,1000);
    camera.position.set(3,3,3);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0,1,0);

    const hemi = new THREE.HemisphereLight(0xffffff,0x444444,1.0);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff,0.8);
    dir.position.set(5,10,7);
    scene.add(dir);

    const grid = new THREE.GridHelper(10,20,0x444444,0x222222);
    scene.add(grid);

    let current = null;
    function resize(){
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w,h);
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize, false);
    resize();

    const loader = new THREE.GLTFLoader();
    function loadUrl(url){
      // remove previous
      if(current){ scene.remove(current); try{ current.traverse(c=>{ if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); }); }catch(e){} current=null; }
      loader.load(url, gltf=>{
        current = gltf.scene || gltf.scenes[0];
        scene.add(current);
        // fit camera
        const box = new THREE.Box3().setFromObject(current);
        const size = box.getSize(new THREE.Vector3()).length();
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);
        camera.position.copy(center).add(new THREE.Vector3(size, size, size));
        controls.update();
      }, xhr=>{}, e=>{ console.error(e); alert('Failed to load: '+(e.message||e)); });
    }

    function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
    animate();

    document.getElementById('loadBtn').addEventListener('click',()=>{
      const sel = document.getElementById('modelSelect').value;
      const url = './' + sel;
      loadUrl(url);
    });

    // load from query param ?model=filename
    const params = new URLSearchParams(location.search);
    if(params.get('model')){
      document.getElementById('modelSelect').value = params.get('model');
      document.getElementById('loadBtn').click();
    }

    // file input
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const url = URL.createObjectURL(file);
      loadUrl(url);
    });

    // drag/drop
    window.addEventListener('dragover', e=>e.preventDefault());
    window.addEventListener('drop', e=>{ e.preventDefault(); if(e.dataTransfer.files.length) { const f = e.dataTransfer.files[0]; if(f.name.toLowerCase().endsWith('.glb')){ const u=URL.createObjectURL(f); loadUrl(u); } else alert('Please drop a .glb file'); } });
  </script>
</body>
</html>
